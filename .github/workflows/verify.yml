name: Verify Pull Request

on:
  pull_request:

env:
  DOTNET_VERSION: 10.0.x

jobs:
  verify-code:
    name: Verify Code Format
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (github)
      uses: actions/checkout@v6

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Verify Formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  verify-tests:
    name: Verify Tests on ${{ matrix.os }}
    needs: [verify-code]

    timeout-minutes: 5

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout (github)
      uses: actions/checkout@v6

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Test (macos)
      if: matrix.os == 'macos-latest'
      run: |
        brew install rocksdb
        dotnet build -p:GITHUB_ACTIONS=true
        dotnet test --no-build --logger "junit;LogFilePath=TestResults/tests-${{ matrix.os }}.xml" -p:GITHUB_ACTIONS=true --binaryLogger:${{ matrix.os }}.binlog

    - name: Test (windows)
      if: matrix.os == 'windows-latest'
      run: |
        dotnet build -p:GITHUB_ACTIONS=true
        dotnet test --no-build --logger "junit;LogFilePath=TestResults/tests-${{ matrix.os }}.xml" -p:GITHUB_ACTIONS=true --binaryLogger:${{ matrix.os }}.binlog

    - name: Test (linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get --assume-yes install librocksdb-dev
        dotnet build -p:GITHUB_ACTIONS=true
        dotnet test --no-build --logger "junit;LogFilePath=TestResults/tests-${{ matrix.os }}.xml" -p:GITHUB_ACTIONS=true --binaryLogger:${{ matrix.os }}.binlog

    - name: Publish Test Results (${{ matrix.os }})
      uses: test-summary/action@dist
      if: always()
      with:
        paths: |
          ${{ github.workspace }}/TestResults/tests-${{ matrix.os }}.xml
        folded: true
        show: "all"
